name: N1 StepRung session-auth fix

on:
  push:
    branches:
      - n1-remove-steprung-token
    paths:
      - .github/workflows/n1-steprung-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: n1-remove-steprung-token

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Remove StepRung admin-token read
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/onesmarter_admin/components/StepRung.jsx')
          source = path.read_text()

          old = """function getAuthHeaders(extra = {}) {
            const token = localStorage.getItem('onesmarter_admin_token');
            const headers = { ...extra };
            if (token) headers['Authorization'] = `Token ${token}`;
            return headers;
          }
          """
          new = """function getAuthHeaders(extra = {}) {
            return { ...extra };
          }
          """

          if old not in source:
              raise SystemExit('Expected StepRung token helper was not found; refusing to make a broad edit.')

          source = source.replace(old, new, 1)

          old_fetch = "fetch('/admin-panel/api/default-smtp/', { headers: getAuthHeaders() })"
          new_fetch = "fetch('/admin-panel/api/default-smtp/', { credentials: 'include', headers: getAuthHeaders() })"
          if old_fetch not in source:
              raise SystemExit('Expected default SMTP request was not found; refusing to make a broad edit.')
          source = source.replace(old_fetch, new_fetch, 1)

          forbidden = (
              "localStorage.getItem('onesmarter_admin_token')",
              'localStorage.getItem("onesmarter_admin_token")',
              "localStorage.setItem('onesmarter_admin_token'",
              'localStorage.setItem("onesmarter_admin_token"',
          )
          if any(value in source for value in forbidden):
              raise SystemExit('StepRung still contains browser-stored administrator token access.')

          path.write_text(source)
          PY

      - name: Verify no admin token reads or writes remain in source
        run: |
          python - <<'PY'
          from pathlib import Path

          offenders = []
          for path in Path('src').rglob('*'):
              if not path.is_file() or path.suffix not in {'.js', '.jsx', '.ts', '.tsx'}:
                  continue
              text = path.read_text(errors='ignore')
              patterns = (
                  "localStorage.getItem('onesmarter_admin_token')",
                  'localStorage.getItem("onesmarter_admin_token")',
                  "localStorage.setItem('onesmarter_admin_token'",
                  'localStorage.setItem("onesmarter_admin_token"',
              )
              if any(pattern in text for pattern in patterns):
                  offenders.append(str(path))
          if offenders:
              raise SystemExit('Admin token localStorage access remains in: ' + ', '.join(offenders))
          print('No admin token localStorage reads/writes remain in src.')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: File-viewer auth regression check
        run: npm run test:file-viewer-auth

      - name: Commit verified StepRung fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/onesmarter_admin/components/StepRung.jsx
          git diff --cached --check
          git commit -m "Remove remaining admin token localStorage read"
          git push origin HEAD:n1-remove-steprung-token
