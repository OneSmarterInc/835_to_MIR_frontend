name: Fix archive MIR filename consistency

on:
  push:

permissions:
  contents: write

jobs:
  fix-archive-name:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update archive MIR filename logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/pages/ArchiveView.jsx")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)

          for i, line in enumerate(lines):
              if "const baseName = (f.original_filename || \"\")" in line:
                  if i + 1 >= len(lines) or 'const mirName = "MIR_" + baseName + ".mir"' not in lines[i + 1]:
                      raise SystemExit("Archive filename block changed unexpectedly; refusing to modify the file.")

                  indent = line[:len(line) - len(line.lstrip())]
                  replacement = [
                      f'{indent}const mirName = f.output_path\n',
                      f'{indent}  ? f.output_path.split("/").pop()\n',
                      f'{indent}  : "MIR_" +\n',
                      f'{indent}    (f.original_filename || "").split(",")[0].trim().replace(/\\.[^/.]+$/, "") + ".mir";\n',
                  ]
                  lines[i:i + 2] = replacement
                  break
          else:
              raise SystemExit("Archive filename block was not found; refusing to modify the file.")

          path.write_text("".join(lines), encoding="utf-8")
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ArchiveView.jsx
          git rm .github/workflows/fix-archive-mir-name.yml
          git commit -m "Fix archive MIR output and download filename"
          git push origin HEAD:master
